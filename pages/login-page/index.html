<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraHub - Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo-container">
        <img src="/assets/icons/" alt="FloraHub Logo">
        <h1>Flora<span>Hub</span></h1>
    </header>

    <main class="main-content">
        <div class="login-container">
            <h2>WELCOME</h2>

            <form>
                <input type="email" placeholder="EMAIL :" required>
                <input type="password" class="input-password" placeholder="PASSWORD :" required>
                
                <button type="submit" class="btn btn-grey btn-enter">ENTER</button>
                <button type="button" class="btn btn-grey">GOOGLE ACCOUNT</button>
                <button type="button" class="btn btn-sign">SIGN IN</button>
            </form>

            <a href="../forgotPassword-page/index.html" class="forgot-link">FORGOT PASSWORD?</a>
        </div>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 FloraHub. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
